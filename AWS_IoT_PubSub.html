<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS IoT Publisher/Subscriber + KVS WebRTC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1692.0/aws-sdk.min.js"></script>
    <script src="https://unpkg.com/amazon-kinesis-video-streams-webrtc/dist/kvs-webrtc.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .message-container {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            height: 300px;
            overflow-y: auto;
        }
        .message {
            border-bottom: 1px solid #eee;
            padding: 8px 0;
        }
        .filter-container {
            margin: 20px 0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .timestamp {
            color: #666;
            font-size: 0.9em;
        }
        .logs-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .log-section {
            flex: 1;
            min-width: 0;
        }
        .publish-section {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .publish-section h3 {
            margin-top: 0;
        }
        .publish-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .publish-row label {
            min-width: 80px;
        }
        .publish-row input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .publish-row textarea {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 60px;
            resize: vertical;
        }
        #publishButton {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #publishButton:hover {
            background-color: #0056b3;
        }
        #publishButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .publish-status {
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;
        }
        .publish-success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        .publish-error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
        }
        .webrtc-section {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .webrtc-section h3 {
            margin-top: 0;
        }
        .webrtc-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .webrtc-row label {
            min-width: 120px;
        }
        .webrtc-row input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #remoteVideo {
            width: 100%;
            max-width: 640px;
            height: auto;
            background-color: #000;
            border-radius: 4px;
        }
        .video-container {
            margin-top: 15px;
            text-align: center;
        }
        #startStreamButton {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #startStreamButton:hover {
            background-color: #218838;
        }
        #stopStreamButton {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #stopStreamButton:hover {
            background-color: #c82333;
        }
        #stopStreamButton:disabled,
        #startStreamButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .webrtc-status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>AWS IoT Publisher/Subscriber</h1>
    <div id="connectionStatus" class="status disconnected">Disconnected</div>

    <!-- Publish Section -->
    <div class="publish-section">
        <h3>Publish Message</h3>
        <div class="publish-row">
            <label for="publishTopic">Topic:</label>
            <input type="text" id="publishTopic" placeholder="Enter topic to publish to" value="cmd/E96TJE8/QDS_BBM/Marcus_0DB3E2_2_THING/req">
        </div>
        <div class="publish-row">
            <label for="publishMessage">Message:</label>
            <textarea id="publishMessage" placeholder="Enter message to publish">{
   "data_type":"data.issued.control",
   "data_id":"1111",
   "timestamp":"0123456789123",
   "data":{
      "jobs":"ota",
      "action":"start",
      "md5":"df3f457ea171be0de83e38cdd99a5367",
      "url":"https://lhkmarcus.com/public/E96TJE8/T3.3.103.9650.ota.bin",
      "size":"14742923",
      "version":"T3.3.103.9650"
   }
}</textarea>
        </div>
        <div class="publish-row">
            <label></label>
            <button id="publishButton" disabled>Publish</button>
        </div>
        <div id="publishStatus" class="publish-status"></div>
    </div>

    <!-- WebRTC Streaming Section -->
    <div class="webrtc-section">
        <h3>AWS KVS WebRTC Streaming</h3>
        <div class="webrtc-row">
            <label for="kvsChannelName">Channel Name:</label>
            <input type="text" id="kvsChannelName" value="Marcus_0DB3E2_2">
        </div>
        <div class="webrtc-row">
            <label for="kvsChannelARN">Channel ARN:</label>
            <input type="text" id="kvsChannelARN" value="arn:aws:kinesisvideo:us-west-2:663530036664:channel/Marcus_0DB3E2_2/1756483251274">
        </div>
        <div class="webrtc-row">
            <label for="kvsRegion">Region:</label>
            <input type="text" id="kvsRegion" value="us-west-2">
        </div>
        <div class="webrtc-row">
            <label></label>
            <button id="startStreamButton">Start Stream</button>
            <button id="stopStreamButton" disabled>Stop Stream</button>
        </div>
        <div id="webrtcStatus" class="webrtc-status status disconnected">Stream Disconnected</div>
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline controls></video>
        </div>
    </div>

    <div class="logs-container">
        <div class="log-section">
            <div class="filter-container">
                <label>
                    Filter Log 1:
                    <input type="text" id="filterText1" placeholder="Enter filter text" value="dt/iot/E96TJE8/QDS_BBM/Marcus_0DB3E2_2_THING/res">
                </label>
            </div>
            <div class="message-container" id="messages1"></div>
        </div>

        <div class="log-section">
            <div class="filter-container">
                <label>
                    Filter Log 2:
                    <input type="text" id="filterText2" placeholder="Enter filter text" value="cmd/E96TJE8/QDS_BBM/Marcus_0DB3E2_2_THING/req">
                </label>
            </div>
            <div class="message-container" id="messages2"></div>
        </div>
    </div>

    <div style="margin: 10px 0;">
        <button id="disconnectButton">Disconnect</button>
        <button id="connectButton" style="display:none;">Connect</button>
        <button id="clearButton">Clear All Messages</button>
        <button id="saveButton">Save All Logs</button>
    </div>

    <script>
        const AWS_ACCESS_KEY = 'YOUR_AWS_ACCESS_KEY';
        const AWS_SECRET_KEY = 'YOUR_AWS_SECRET_KEY';
        const AWS_IOT_ENDPOINT = 'YOUR_IOT_ENDPOINT.iot.us-west-2.amazonaws.com';
        const AWS_REGION = 'us-west-2';

        const topics = [
            'cmd/E96TJE8/QDS_BBM/#',
            'dt/iot/E96TJE8/QDS_BBM/#'
        ];

        const messagesDivs = [
            document.getElementById('messages1'),
            document.getElementById('messages2')
        ];
        const filterInputs = [
            document.getElementById('filterText1'),
            document.getElementById('filterText2')
        ];
        const connectionStatus = document.getElementById('connectionStatus');
        const publishButton = document.getElementById('publishButton');
        const publishTopicInput = document.getElementById('publishTopic');
        const publishMessageInput = document.getElementById('publishMessage');
        const publishStatusDiv = document.getElementById('publishStatus');
        const connectButton = document.getElementById('connectButton');
        const disconnectButton = document.getElementById('disconnectButton');

        let mqttClient = null;
        let reconnectTimeout = null;
        let manualDisconnect = false;
        const RECONNECT_DELAY = 5000;

        // Save all logs function
        function saveAllLogs() {
            messagesDivs.forEach((messagesDiv, index) => {
                const messages = Array.from(messagesDiv.getElementsByClassName('message'))
                    .map(msg => {
                        const timestamp = msg.querySelector('.timestamp').textContent;
                        const content = msg.textContent.replace(timestamp, '').trim();
                        return `${timestamp} - ${content}`;
                    })
                    .join('\n');

                if (messages) {
                    const timestamp = new Date().toISOString().split('T')[0];
                    const filterText = filterInputs[index].value.trim();
                    const blob = new Blob([messages], { type: 'text/plain' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `log_${filterText || 'unfiltered'}_${timestamp}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                }
            });
        }

        // Add message to log containers
        function addMessage(topic, message, isSystem = false) {
            const timestamp = new Date().toLocaleTimeString();
            const messageHTML = isSystem ?
                `<div class="timestamp">${timestamp}</div><strong>System:</strong> ${message}` :
                `<div class="timestamp">${timestamp}</div><strong>Topic:</strong> ${topic}<br><strong>Message:</strong> ${message}`;

            messagesDivs.forEach((messagesDiv, index) => {
                const filterText = filterInputs[index].value.trim();
                const shouldDisplay = isSystem || !filterText || topic?.includes(filterText);

                if (shouldDisplay) {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message';
                    messageElement.innerHTML = messageHTML;
                    messagesDiv.insertBefore(messageElement, messagesDiv.firstChild);
                }
            });
        }

        // Update connection status
        function updateStatus(connected, message = null) {
            connectionStatus.textContent = connected ? 'Connected' : (message || 'Disconnected');
            connectionStatus.className = `status ${connected ? 'connected' : 'disconnected'}`;
            publishButton.disabled = !connected;

            // Toggle connect/disconnect buttons
            if (connected) {
                disconnectButton.style.display = 'inline-block';
                connectButton.style.display = 'none';
            } else if (manualDisconnect) {
                disconnectButton.style.display = 'none';
                connectButton.style.display = 'inline-block';
            }
        }

        // Show publish status
        function showPublishStatus(success, message) {
            publishStatusDiv.textContent = message;
            publishStatusDiv.className = `publish-status ${success ? 'publish-success' : 'publish-error'}`;
            setTimeout(() => {
                publishStatusDiv.className = 'publish-status';
            }, 3000);
        }

        // Publish message to topic
        function publishMessage() {
            const topic = publishTopicInput.value.trim();
            const message = publishMessageInput.value.trim();

            if (!topic) {
                showPublishStatus(false, 'Please enter a topic');
                return;
            }

            if (!message) {
                showPublishStatus(false, 'Please enter a message');
                return;
            }

            if (!mqttClient || !mqttClient.isConnected()) {
                showPublishStatus(false, 'Not connected to AWS IoT');
                return;
            }

            try {
                const mqttMessage = new Paho.MQTT.Message(message);
                mqttMessage.destinationName = topic;
                mqttMessage.qos = 0;
                mqttClient.send(mqttMessage);
                showPublishStatus(true, `Message published to ${topic}`);
                addMessage(topic, `[SENT] ${message}`, false);
            } catch (error) {
                console.error('Publish error:', error);
                showPublishStatus(false, `Failed to publish: ${error.message}`);
            }
        }

        // Generate AWS SigV4 signature
        function sign(key, msg) {
            const wordArray = CryptoJS.HmacSHA256(msg, key);
            return wordArray;
        }

        function getSignatureKey(key, dateStamp, regionName, serviceName) {
            const kDate = sign('AWS4' + key, dateStamp);
            const kRegion = sign(kDate, regionName);
            const kService = sign(kRegion, serviceName);
            const kSigning = sign(kService, 'aws4_request');
            return kSigning;
        }

        function getWebSocketUrl() {
            const datetime = new Date().toISOString().replace(/[:\-]|\.\d{3}/g, '');
            const date = datetime.substr(0, 8);

            const method = 'GET';
            const protocol = 'wss';
            const uri = '/mqtt';
            const service = 'iotdevicegateway';
            const algorithm = 'AWS4-HMAC-SHA256';
            const credentialScope = date + '/' + AWS_REGION + '/' + service + '/aws4_request';

            let queryParams = {
                'X-Amz-Algorithm': algorithm,
                'X-Amz-Credential': AWS_ACCESS_KEY + '/' + credentialScope,
                'X-Amz-Date': datetime,
                'X-Amz-SignedHeaders': 'host'
            };

            const canonicalQuerystring = Object.keys(queryParams)
                .sort()
                .map(key => `${key}=${encodeURIComponent(queryParams[key])}`)
                .join('&');

            const canonicalHeaders = 'host:' + AWS_IOT_ENDPOINT + '\n';
            const payloadHash = CryptoJS.SHA256('').toString(CryptoJS.enc.Hex);

            const canonicalRequest = method + '\n' + uri + '\n' + canonicalQuerystring + '\n' + canonicalHeaders + '\nhost\n' + payloadHash;
            const stringToSign = algorithm + '\n' + datetime + '\n' + credentialScope + '\n' + CryptoJS.SHA256(canonicalRequest).toString(CryptoJS.enc.Hex);
            const signingKey = getSignatureKey(AWS_SECRET_KEY, date, AWS_REGION, service);
            const signature = CryptoJS.HmacSHA256(stringToSign, signingKey).toString(CryptoJS.enc.Hex);

            queryParams['X-Amz-Signature'] = signature;

            const querystring = Object.keys(queryParams)
                .map(key => `${key}=${encodeURIComponent(queryParams[key])}`)
                .join('&');

            return `wss://${AWS_IOT_ENDPOINT}${uri}?${querystring}`;
        }

        function disconnect() {
            manualDisconnect = true;
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
            if (mqttClient && mqttClient.isConnected()) {
                mqttClient.disconnect();
                updateStatus(false, 'Manually Disconnected');
            }
        }

        function connectToIoT() {
            manualDisconnect = false;
            try {
                const clientId = 'mqtt-client-' + Math.random().toString(16).substr(2, 8);
                mqttClient = new Paho.MQTT.Client(getWebSocketUrl(), clientId);

                mqttClient.onConnectionLost = (responseObject) => {
                    if (responseObject.errorCode !== 0) {
                        console.log('Connection lost:', responseObject.errorMessage);
                        updateStatus(false, 'Connection lost - Reconnecting...');
                        addMessage(null, `Connection lost: ${responseObject.errorMessage}`, true);

                        // Attempt to reconnect only if not manually disconnected
                        if (!manualDisconnect) {
                            reconnectTimeout = setTimeout(() => {
                                connectToIoT();
                            }, RECONNECT_DELAY);
                        }
                    }
                };

                mqttClient.onMessageArrived = (message) => {
                    const messageStr = message.payloadString;
                    const topic = message.destinationName;

                    // Display message in each container based on its own filter
                    messagesDivs.forEach((messagesDiv, index) => {
                        const filterText = filterInputs[index].value.trim();
                        const shouldDisplay = !filterText || topic.includes(filterText);

                        if (shouldDisplay) {
                            const messageElement = document.createElement('div');
                            messageElement.className = 'message';
                            const timestamp = new Date().toLocaleTimeString();
                            messageElement.innerHTML = `
                                <div class="timestamp">${timestamp}</div>
                                <strong>Topic:</strong> ${topic}<br>
                                <strong>Message:</strong> ${messageStr}
                            `;
                            messagesDiv.insertBefore(messageElement, messagesDiv.firstChild);
                        }
                    });
                };

                const connectOptions = {
                    useSSL: true,
                    timeout: 3,
                    onSuccess: () => {
                        console.log('Connected to AWS IoT');
                        updateStatus(true);
                        addMessage(null, 'Connected to AWS IoT', true);

                        // Subscribe to topics
                        topics.forEach(topic => {
                            mqttClient.subscribe(topic, {
                                qos: 0,
                                onSuccess: () => {
                                    console.log(`Subscribed to ${topic}`);
                                    addMessage(null, `Subscribed to ${topic}`, true);
                                },
                                onFailure: (error) => {
                                    console.error(`Failed to subscribe to ${topic}:`, error);
                                    addMessage(null, `Failed to subscribe to ${topic}: ${error.errorMessage}`, true);
                                }
                            });
                        });
                    },
                    onFailure: (error) => {
                        console.error('Failed to connect:', error);
                        updateStatus(false, `Connection Failed: ${error.errorMessage}`);
                        addMessage(null, `Connection error: ${error.errorMessage}`, true);

                        // Attempt to reconnect only if not manually disconnected
                        if (!manualDisconnect) {
                            reconnectTimeout = setTimeout(() => {
                                connectToIoT();
                            }, RECONNECT_DELAY);
                        }
                    }
                };

                mqttClient.connect(connectOptions);
                return mqttClient;
            } catch (error) {
                console.error('Failed to initialize client:', error);
                updateStatus(false, `Initialization Failed: ${error.message}`);
                addMessage(null, `Initialization error: ${error.message}`, true);

                // Attempt to reconnect only if not manually disconnected
                if (!manualDisconnect) {
                    reconnectTimeout = setTimeout(() => {
                        connectToIoT();
                    }, RECONNECT_DELAY);
                }
            }
        }

        // Connect to AWS IoT on page load
        connectToIoT();

        // Setup button handlers
        disconnectButton.onclick = disconnect;
        connectButton.onclick = connectToIoT;
        publishButton.onclick = publishMessage;

        // Setup clear button
        const clearButton = document.getElementById('clearButton');
        clearButton.onclick = () => {
            messagesDivs.forEach(div => div.innerHTML = '');
        };

        // Add save button handler
        const saveButton = document.getElementById('saveButton');
        saveButton.onclick = saveAllLogs;

        // Allow publishing with Enter key in message field (Shift+Enter for new line)
        publishMessageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                publishMessage();
            }
        });

        // ========== KVS WebRTC Streaming ==========
        const kvsChannelNameInput = document.getElementById('kvsChannelName');
        const kvsChannelARNInput = document.getElementById('kvsChannelARN');
        const kvsRegionInput = document.getElementById('kvsRegion');
        const startStreamButton = document.getElementById('startStreamButton');
        const stopStreamButton = document.getElementById('stopStreamButton');
        const remoteVideo = document.getElementById('remoteVideo');
        const webrtcStatusDiv = document.getElementById('webrtcStatus');

        let signalingClient = null;
        let peerConnection = null;
        let dataChannel = null;

        function updateWebrtcStatus(connected, message = null) {
            webrtcStatusDiv.textContent = connected ? 'Stream Connected' : (message || 'Stream Disconnected');
            webrtcStatusDiv.className = `webrtc-status status ${connected ? 'connected' : 'disconnected'}`;
        }

        async function startKVSStream() {
            const channelName = kvsChannelNameInput.value.trim();
            const channelARN = kvsChannelARNInput.value.trim();
            const region = kvsRegionInput.value.trim();

            if (!channelName || !channelARN) {
                updateWebrtcStatus(false, 'Please enter Channel Name and ARN');
                return;
            }

            try {
                updateWebrtcStatus(false, 'Connecting...');
                startStreamButton.disabled = true;

                // Configure AWS SDK
                const kinesisVideoClient = new AWS.KinesisVideo({
                    region: region,
                    accessKeyId: AWS_ACCESS_KEY,
                    secretAccessKey: AWS_SECRET_KEY,
                    correctClockSkew: true
                });

                // Get signaling channel endpoints
                const getSignalingChannelEndpointResponse = await kinesisVideoClient
                    .getSignalingChannelEndpoint({
                        ChannelARN: channelARN,
                        SingleMasterChannelEndpointConfiguration: {
                            Protocols: ['WSS', 'HTTPS'],
                            Role: KVSWebRTC.Role.VIEWER
                        }
                    })
                    .promise();

                const endpointsByProtocol = getSignalingChannelEndpointResponse.ResourceEndpointList.reduce(
                    (endpoints, endpoint) => {
                        endpoints[endpoint.Protocol] = endpoint.ResourceEndpoint;
                        return endpoints;
                    },
                    {}
                );

                // Create KVS signaling client
                const kinesisVideoSignalingChannelsClient = new AWS.KinesisVideoSignalingChannels({
                    region: region,
                    accessKeyId: AWS_ACCESS_KEY,
                    secretAccessKey: AWS_SECRET_KEY,
                    endpoint: endpointsByProtocol.HTTPS,
                    correctClockSkew: true
                });

                // Get ICE server configuration
                const getIceServerConfigResponse = await kinesisVideoSignalingChannelsClient
                    .getIceServerConfig({
                        ChannelARN: channelARN
                    })
                    .promise();

                const iceServers = [
                    { urls: `stun:stun.kinesisvideo.${region}.amazonaws.com:443` }
                ];

                getIceServerConfigResponse.IceServerList.forEach(iceServer => {
                    iceServers.push({
                        urls: iceServer.Uris,
                        username: iceServer.Username,
                        credential: iceServer.Password
                    });
                });

                // Create signaling client
                signalingClient = new KVSWebRTC.SignalingClient({
                    channelARN: channelARN,
                    channelEndpoint: endpointsByProtocol.WSS,
                    clientId: 'viewer-' + Math.random().toString(36).substring(2, 10),
                    role: KVSWebRTC.Role.VIEWER,
                    region: region,
                    credentials: {
                        accessKeyId: AWS_ACCESS_KEY,
                        secretAccessKey: AWS_SECRET_KEY
                    }
                });

                const configuration = {
                    iceServers,
                    iceTransportPolicy: 'all'
                };

                peerConnection = new RTCPeerConnection(configuration);

                // Add transceiver for receiving video
                peerConnection.addTransceiver('video', { direction: 'recvonly' });
                peerConnection.addTransceiver('audio', { direction: 'recvonly' });

                // Handle peer connection events - set up before signaling opens
                peerConnection.addEventListener('icecandidate', ({ candidate }) => {
                    if (candidate && signalingClient) {
                        console.log('[VIEWER] Sending ICE candidate');
                        try {
                            signalingClient.sendIceCandidate(candidate);
                        } catch (e) {
                            console.warn('[VIEWER] Could not send ICE candidate:', e.message);
                        }
                    }
                });

                peerConnection.addEventListener('track', event => {
                    console.log('[VIEWER] Received remote track');
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        updateWebrtcStatus(true);
                        stopStreamButton.disabled = false;
                    }
                });

                peerConnection.addEventListener('connectionstatechange', () => {
                    console.log('[VIEWER] Connection state:', peerConnection.connectionState);
                    if (peerConnection.connectionState === 'connected') {
                        updateWebrtcStatus(true);
                    } else if (peerConnection.connectionState === 'disconnected' ||
                               peerConnection.connectionState === 'failed') {
                        updateWebrtcStatus(false, `Connection ${peerConnection.connectionState}`);
                    }
                });

                // Handle signaling client events
                signalingClient.on('open', async () => {
                    console.log('[VIEWER] Connected to signaling service');
                    updateWebrtcStatus(false, 'Signaling connected, creating offer...');

                    try {
                        // Create and send offer AFTER signaling is open
                        const offer = await peerConnection.createOffer({
                            offerToReceiveAudio: true,
                            offerToReceiveVideo: true
                        });
                        await peerConnection.setLocalDescription(offer);
                        console.log('[VIEWER] Sending SDP offer');
                        signalingClient.sendSdpOffer(peerConnection.localDescription);
                        updateWebrtcStatus(false, 'Offer sent, waiting for answer...');
                    } catch (e) {
                        console.error('[VIEWER] Error creating/sending offer:', e);
                        updateWebrtcStatus(false, `Error: ${e.message}`);
                    }
                });

                signalingClient.on('sdpAnswer', async answer => {
                    console.log('[VIEWER] Received SDP answer');
                    await peerConnection.setRemoteDescription(answer);
                    updateWebrtcStatus(false, 'Answer received, connecting...');
                });

                signalingClient.on('iceCandidate', candidate => {
                    console.log('[VIEWER] Received ICE candidate');
                    peerConnection.addIceCandidate(candidate);
                });

                signalingClient.on('close', () => {
                    console.log('[VIEWER] Disconnected from signaling service');
                    updateWebrtcStatus(false, 'Signaling disconnected');
                });

                signalingClient.on('error', error => {
                    console.error('[VIEWER] Signaling client error:', error);
                    updateWebrtcStatus(false, `Error: ${error.message || error}`);
                });

                // Open signaling connection - offer will be sent in 'open' handler
                console.log('[VIEWER] Opening signaling connection...');
                signalingClient.open();

            } catch (error) {
                console.error('[VIEWER] Error starting stream:', error);
                updateWebrtcStatus(false, `Error: ${error.message}`);
                startStreamButton.disabled = false;
            }
        }

        function stopKVSStream() {
            console.log('[VIEWER] Stopping stream');

            if (signalingClient) {
                signalingClient.close();
                signalingClient = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (remoteVideo.srcObject) {
                remoteVideo.srcObject.getTracks().forEach(track => track.stop());
                remoteVideo.srcObject = null;
            }

            updateWebrtcStatus(false, 'Stream stopped');
            startStreamButton.disabled = false;
            stopStreamButton.disabled = true;
        }

        // Setup WebRTC button handlers
        startStreamButton.onclick = startKVSStream;
        stopStreamButton.onclick = stopKVSStream;
    </script>
</body>
</html>
